<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | PrepPath</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <div class="login-container">
      <a href="index.html" class="login-brand">PrepPath</a>

      <div class="login-card">
        <h1>Create Account</h1>
        <p class="login-subtitle">
          Join PrepPath and start your placement preparation.
        </p>

        <form id="registerForm">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          />

          <label for="registerEmail">Email Address</label>
          <input
            type="email"
            id="registerEmail"
            placeholder="Enter your email"
            required
          />

          <label for="course">Course</label>
          <select id="course" required>
            <option value="">Select your course</option>
            <option value="BCA">BCA</option>
            <option value="BTech">B.Tech</option>
            <option value="BSc">B.Sc</option>
            <option value="Other">Other</option>
          </select>

          <label for="registerPassword">Password</label>
          <input
            type="password"
            id="registerPassword"
            placeholder="Create a password"
            minlength="8"
            required
          />

          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            minlength="8"
            required
          />

          <button type="submit" class="login-submit">Create Account</button>

          <p id="registerMessage" role="status"></p>
        </form>

        <p class="signup-text">
          Already have an account?
          <a href="login.html">Login</a>
        </p>

        <a href="index.html" class="back-home">← Back to Home</a>
      </div>
    </div>

    <script src="register.js"></script>
  </body>
</html>
